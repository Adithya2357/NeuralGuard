[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralguard"
version = "0.2.0"
description = "AI-powered real-time network intrusion detection with Kafka, scikit-learn, Elasticsearch and Grafana."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adithya Chiluka" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "kafka-python>=2.0.3",
    "elasticsearch>=8.12,<9",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "joblib>=1.3",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
neuralguard = "neuralguard.cli:main"

[tool.setuptools.packages.find]
include = ["neuralguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs live Kafka + Elasticsearch (set NEURALGUARD_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.coverage.run]
source = ["neuralguard"]
