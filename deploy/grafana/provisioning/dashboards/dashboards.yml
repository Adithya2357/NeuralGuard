# Loads every dashboard JSON file in /var/lib/grafana/dashboards (bind-mounted from
# deploy/grafana/dashboards by docker-compose.yml).
apiVersion: 1

providers:
  - name: neuralguard
    orgId: 1
    folder: NeuralGuard
    type: file
    disableDeletion: true
    # The JSON files in the repository are the source of truth; edit them, not the UI.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
